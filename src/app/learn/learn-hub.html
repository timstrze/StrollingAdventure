<main class="content-page">
  <a routerLink="/" class="back-link">&larr; Back to home</a>

  <h1>Learn About Nature</h1>

  <p>
    Each topic below comes from the end notes in <em>Strolling Adventure</em> — real facts about
    the sun, wildlife, and plants you can discover on a stroll through Yorktown, Virginia.
  </p>

  <div class="card-grid">
    @for (topic of topics; track topic.slug) {
      <a class="card-link" [routerLink]="['/learn', topic.slug]">
        <span>
          <span class="card-link-name">{{ topic.title }}</span>
          <span class="card-link-desc">{{ topic.inBook }}</span>
        </span>
        <span aria-hidden="true">&rarr;</span>
      </a>
    }
  </div>

  <app-site-footer />
</main>
